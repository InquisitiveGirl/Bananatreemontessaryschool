<!DOCTYPE html>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; }
header { background: #4CAF50; color: white; padding: 20px; text-align: center; }
nav { background: #333; padding: 10px; text-align: center; }
nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
nav a:hover { text-decoration: underline; }


.container {
max-width: 600px;
background: white;
margin: 30px auto;
padding: 20px;
border-radius: 10px;
box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}


label { font-weight: bold; }
input, textarea {
width: 100%;
padding: 10px;
margin: 8px 0 15px;
border: 1px solid #ccc;
border-radius: 5px;
}


button {
background: #4CAF50;
color: white;
padding: 10px 20px;
border: none;
border-radius: 5px;
cursor: pointer;
font-size: 16px;
}


button:hover { background: #45a049; }


footer { background: #4CAF50; color: white; text-align: center; padding: 15px; margin-top: 20px; }
</style>
</head>
<body>


<header>
<h1>Contact Banana Tree School</h1>
<p>We would love to hear from you</p>
</header>


<nav>
<a href="index.html">Home</a>
<a href="gallery.html">Gallery</a>
<a href="Contact.html">Contact</a>
</nav>


<div class="container">
<form>
<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>


<label>Address</label>
<textarea rows="3" placeholder="Enter your address" required></textarea>


<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number" required>


<button type="submit">Submit</button>
</form>
</div>


<footer>
<p>© 2025 Banana Tree School. All Rights Reserved.</p>
</footer>


</body>
</html>
